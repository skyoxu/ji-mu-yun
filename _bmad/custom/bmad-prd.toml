# ADR-0048 / AD-5. Team customization; official BMAD stays unchanged.
[workflow]
activation_steps_append = ["Before repository-fact scope decisions, use the repository prepare-consumption interface: python3 -B scripts/toolchain/knowledge_query/adapter.py prepare-consumption --repository-root <actual-project-root>. Supply UTF-8 JSON on stdin: stage=prd, operation=create or update, task_id=stable PRD slug, mode=headless or interactive, inputs=explicit repository-relative source paths, scope=those paths, query=targeted factual question, record_path=the existing PRD .memlog.md path. If task identity or inputs are not known at activation, defer this command until they are known and before decisions; do not claim a query ran. Initialize the native memlog through its official command before using it as a record. Read returned verified sources and their path/hash/read_identity. Repeated unchanged triggers use the same task and record. Stop blocked/cancelled/budget_exhausted. For unavailable/degraded/no_match independently check direct sources and retain unresolved facts. Record native accepted/rejected decisions with reason and actual use, topic/consumer/raw status and source identity; distinguish implementation, historical planning, exclusions, new scope and unverified claims. Never infer adoption from adapter output or publish knowledge. Pure editorial updates may reuse verified source records with an explicit reason."]
