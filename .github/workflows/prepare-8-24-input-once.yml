name: Prepare 8-24 input once
on:
  push:
    branches:
      - implementation/8-24-identity-isolation-recovery-v2
    paths:
      - .github/workflows/prepare-8-24-input-once.yml
permissions:
  contents: write
concurrency:
  group: prepare-8-24-input-once
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependency
        run: python -m pip install pytest==9.1.1
      - name: Assemble and verify input without models or Phase tests
        run: python -B execution-plans/2026-08-24-phase-b-c-identity-isolation-workspace-recovery/tools/publish_prepared_input.py
      - name: Publish verified input to the same branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- execution-plans/2026-08-24-phase-b-c-identity-isolation-workspace-recovery .github/workflows/prepare-8-24-input-once.yml
          git add -f -- logs/phase-b-c-input-repair/local-rebuild
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          allowed = ("execution-plans/2026-08-24-phase-b-c-identity-isolation-workspace-recovery/", "logs/phase-b-c-input-repair/local-rebuild/")
          assert paths and all(p.startswith(allowed) or p == ".github/workflows/prepare-8-24-input-once.yml" for p in paths), paths
          PY
          git diff --cached --check
          git commit -m "fix(phase-plan): publish verified 73-slice 8-24 input"
          git push origin HEAD:refs/heads/implementation/8-24-identity-isolation-recovery-v2
