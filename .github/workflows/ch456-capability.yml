name: Chapter 4-5-6 Capability Harness

on:
  push:
    branches:
      - implementation/vdd-quick-dev-456
  workflow_dispatch:

jobs:
  capability-harness:
    runs-on: windows-latest
    env:
      SC_LLM_BACKEND: openai-api
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and compatibility test dependencies
        shell: pwsh
        run: |
          py -3 -m pip install pytest openai
          choco install ripgrep -y --no-progress
      - name: VDD semantic compiler and closure tests
        run: py -3 -m pytest -q .agents/skills/vdd-execution-plan/scripts/tests/test_semantic_compiler_ch456.py .agents/skills/vdd-execution-plan/scripts/tests/test_ch456_compiler_closure.py .agents/skills/vdd-execution-plan/scripts/tests/test_ch456_failed_resume.py .agents/skills/vdd-execution-plan/scripts/tests/test_ch456_planned_red_feasibility.py
      - name: Evaluate Architecture Deferred reconciliation
        run: py -3 scripts/vdd/evaluate_architecture_reconcile.py --out ch456-architecture-reconcile.json
      - name: Evaluate curated semantic quality
        run: py -3 scripts/vdd/evaluate_semantic_quality.py --out ch456-curated-semantic-quality.json
      - name: Evaluate semantic chain mutation rejection
        run: py -3 scripts/vdd/evaluate_semantic_chain_mutations.py --out ch456-semantic-chain-mutations.json
      - name: Evaluate agent context mutation rejection
        run: py -3 scripts/vdd/evaluate_agent_context_mutations.py --out ch456-agent-context-mutations.json
      - name: Probe real semantic worker backend
        run: py -3 scripts/vdd/probe_real_worker.py --out ch456-real-worker-probe.json
      - name: Evaluate real semantic worker quality when available
        run: py -3 scripts/vdd/evaluate_real_semantic_quality.py --backend openai-api --out ch456-real-semantic-quality.json
      - name: Quick Dev runtime contract tests
        run: py -3 -m pytest -q .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_runtime_contracts.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_full_lifecycle.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_recovery_mutations.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_stable_runner.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_q6_regression_gate.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_snapshot_exclusions.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_worker_orchestration.py
      - name: Evaluate stable facade routing
        run: py -3 scripts/quick_dev/evaluate_stable_facade.py --out ch456-stable-facade.json
      - name: Evaluate detached promotion mutation rejection
        run: py -3 scripts/quick_dev/evaluate_detached_mutations.py --out ch456-detached-mutations.json
      - name: Evaluate selective replay accuracy
        run: py -3 scripts/quick_dev/evaluate_replay_matrix.py --out ch456-selective-replay.json
      - name: Fresh medium deterministic three-behavior task
        run: py -3 -m pytest -q .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_fresh_medium_task.py
      - name: Live blind medium task when backend is available
        shell: pwsh
        run: |
          if ($env:OPENAI_API_KEY) {
            py -3 scripts/quick_dev/run_live_blind_benchmark.py --backend openai-api --require-live --out ch456-live-blind-benchmark.json
          } else {
            py -3 scripts/quick_dev/run_live_blind_benchmark.py --backend openai-api --out ch456-live-blind-benchmark.json
          }
      - name: Full VDD skill regression
        run: py -3 -m pytest -q .agents/skills/vdd-execution-plan/scripts/tests
      - name: Full Quick Dev skill regression
        run: py -3 -m pytest -q .agents/skills/quick-dev-tdd-adapter/tools/tests
      - name: Replay 8-25 real RED-to-GREEN selectors
        run: py -3 scripts/quick_dev/replay_legacy_tdd.py --plan execution-plans/2026-08-25-vdd-quick-dev-semantic-oracle-recovery --red-baseline 7890d90cd9a9183159742bacc5575a07ad061dc7 --out ch456-8-25-replay.json
      - name: Freeze candidate-bound final evidence manifest
        if: always()
        run: >-
          py -3 scripts/quick_dev/build_final_evidence_manifest.py
          --architecture-reconcile ch456-architecture-reconcile.json
          --curated-semantic ch456-curated-semantic-quality.json
          --semantic-chain-mutations ch456-semantic-chain-mutations.json
          --agent-context-mutations ch456-agent-context-mutations.json
          --real-semantic ch456-real-semantic-quality.json
          --stable-facade ch456-stable-facade.json
          --detached-mutations ch456-detached-mutations.json
          --selective-replay ch456-selective-replay.json
          --live-blind ch456-live-blind-benchmark.json
          --legacy-replay ch456-8-25-replay.json
          --out ch456-final-evidence-manifest.json
      - name: Strict final work-package completion gate
        if: always()
        run: >-
          py -3 scripts/quick_dev/evaluate_final_completion.py
          --manifest ch456-final-evidence-manifest.json
          --architecture-reconcile ch456-architecture-reconcile.json
          --curated-semantic ch456-curated-semantic-quality.json
          --semantic-chain-mutations ch456-semantic-chain-mutations.json
          --agent-context-mutations ch456-agent-context-mutations.json
          --real-semantic ch456-real-semantic-quality.json
          --stable-facade ch456-stable-facade.json
          --detached-mutations ch456-detached-mutations.json
          --selective-replay ch456-selective-replay.json
          --live-blind ch456-live-blind-benchmark.json
          --legacy-replay ch456-8-25-replay.json
          --out ch456-final-completion.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch456-capability-evidence
          path: |
            ch456-architecture-reconcile.json
            ch456-curated-semantic-quality.json
            ch456-semantic-chain-mutations.json
            ch456-agent-context-mutations.json
            ch456-real-worker-probe.json
            ch456-real-semantic-quality.json
            ch456-stable-facade.json
            ch456-detached-mutations.json
            ch456-selective-replay.json
            ch456-live-blind-benchmark.json
            ch456-8-25-replay.json
            ch456-final-evidence-manifest.json
            ch456-final-completion.json
          if-no-files-found: ignore
