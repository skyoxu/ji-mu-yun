name: Chapter 4-5-6 Capability Harness

on:
  push:
    branches:
      - implementation/vdd-quick-dev-456
  workflow_dispatch:

jobs:
  capability-harness:
    runs-on: windows-latest
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .agents/skills/vdd-execution-plan
            .agents/skills/quick-dev-tdd-adapter
            .agents/skills/run-phase-bootstrap-review
            .agents/skills/run-refactor-implementation-acceptance
            execution-plans/2026-07-07-phase-a-frontend-gdd-to-module-workflow-hardening
            execution-plans/2026-07-11-phase-frontend-boundary-hardening-execution-plan
            execution-plans/2026-07-12-llm-review-evidence-gate-hardening
            execution-plans/2026-07-15-repository-maintenance-tdd-adapter
            execution-plans/2026-08-17-acceptance-coordinator-efficiency
            execution-plans/2026-08-17-quick-dev-tdd-stage-recovery
            execution-plans/2026-08-25-vdd-quick-dev-semantic-oracle-recovery
            scripts/sc
            scripts/vdd
            scripts/quick_dev
            scripts/python
            scripts/toolchain
            AGENTS.md
            agentbuild.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and compatibility test dependencies
        shell: pwsh
        run: |
          py -3 -m pip install pytest
          choco install ripgrep -y --no-progress
      - name: VDD semantic compiler tests
        run: py -3 -m pytest -q .agents/skills/vdd-execution-plan/scripts/tests/test_semantic_compiler_ch456.py
      - name: Probe real semantic worker backend
        run: py -3 scripts/vdd/probe_real_worker.py --out ch456-real-worker-probe.json
      - name: Quick Dev runtime contract tests
        run: py -3 -m pytest -q .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_runtime_contracts.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_full_lifecycle.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_recovery_mutations.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_stable_runner.py .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_q6_regression_gate.py
      - name: Fresh medium three-behavior task
        run: py -3 -m pytest -q .agents/skills/quick-dev-tdd-adapter/tools/tests/test_ch456_fresh_medium_task.py
      - name: Full VDD skill regression
        run: py -3 -m pytest -q .agents/skills/vdd-execution-plan/scripts/tests
      - name: Full Quick Dev skill regression
        run: py -3 -m pytest -q .agents/skills/quick-dev-tdd-adapter/tools/tests
      - name: Replay 8-25 real RED-to-GREEN selectors
        run: py -3 scripts/quick_dev/replay_legacy_tdd.py --plan execution-plans/2026-08-25-vdd-quick-dev-semantic-oracle-recovery --red-baseline 7890d90cd9a9183159742bacc5575a07ad061dc7 --out ch456-8-25-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch456-capability-evidence
          path: |
            ch456-real-worker-probe.json
            ch456-8-25-replay.json
          if-no-files-found: ignore
